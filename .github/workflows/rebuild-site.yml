name: Rebuild Ofoten Ror site

on:
  push:
    branches:
      - main
    paths:
      - '.site-bundle/chunk-*'
      - '.github/workflows/rebuild-site.yml'

permissions:
  contents: write

jobs:
  unpack-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack rebuilt website
        shell: bash
        run: |
          set -euo pipefail
          cat .site-bundle/chunk-* | base64 --decode > /tmp/ofoten-site.tar.gz
          echo 'cb626a2fe0b05ad28fdd2184f4df7cea8274907f686b7fbdc34a61f180273ef0  /tmp/ofoten-site.tar.gz' | sha256sum -c -
          rm -rf /tmp/ofoten-site
          mkdir -p /tmp/ofoten-site
          tar -xzf /tmp/ofoten-site.tar.gz -C /tmp/ofoten-site

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name .site-bundle \
            -exec rm -rf {} +

          cp -a /tmp/ofoten-site/. .
          touch .nojekyll

      - name: Validate JavaScript and required pages
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/site.js
          node --check assets/planner.js
          node --check assets/showroom.js
          test -s index.html
          test -s showroom.html
          test -s planlegg.html
          test -s tjenester.html
          test -s butikk.html
          test -s prosjekter.html
          test -s galleri.html
          test -s tilbud.html
          test -s forhandlere.html
          test -s om-oss.html
          test -s ansatte.html
          test -s kontakt.html

      - name: Commit rebuilt website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No website changes to commit.'
            exit 0
          fi
          git commit -m 'Deploy rebuilt Ofoten Ror website'
          git push
